<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Work in progress, shared privately for review. These keep the draft out
         of search results while it carries a real company's name; remove them
         when the site goes live. A robots.txt would not help here: crawlers only
         read it at the domain root, which this project site does not own. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="googlebot" content="noindex, nofollow" />
    <title>Corniche İstanbul — Projeler</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="loading-screen" id="loadingScreen" role="status">
      <div class="loading-inner">
        <div class="loading-brand">CORNICHE İSTANBUL</div>
        <div class="loading-text" data-i18n="ui.loading">Arşiv yükleniyor</div>
        <div class="loading-bar"><span></span></div>
      </div>
    </div>

    <header class="site-header">
      <!-- Placeholder wordmark, shown on phones only: on wider screens the
           wordmark lives in the middle of the ring. The dashed rule marks where
           the real logo goes. -->
      <div class="brand" id="brand">CORNICHE İSTANBUL</div>
    </header>

    <!-- The only furniture in the top right: the menu button and the language
         choice, inside one hairline frame. -->
    <div class="topright">
      <button class="menu-toggle" type="button" id="menuToggle"
              aria-label="Menü" aria-expanded="false" aria-controls="menuPanel">
        <span></span><span></span><span></span>
      </button>
      <div class="lang">
        <button type="button" class="lang-btn is-active" data-lang="tr">TR</button>
        <span class="sep">/</span>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
      </div>
    </div>

    <div class="menu-scrim" id="menuScrim"></div>

    <nav class="menu-panel" id="menuPanel" aria-label="Ana menü">
      <button class="menu-close" type="button" id="menuClose" aria-label="Menüyü kapat">
        <span></span><span></span>
      </button>
      <ul class="menu-list">
        <li><a href="#" data-i18n-pair="nav.projects"><span class="mi-a"></span><span class="mi-b"></span></a></li>
        <li><a href="#" data-i18n-pair="nav.about"><span class="mi-a"></span><span class="mi-b"></span></a></li>
        <li><a href="#" data-i18n-pair="nav.services"><span class="mi-a"></span><span class="mi-b"></span></a></li>
        <li><a href="#" data-i18n-pair="nav.showroom"><span class="mi-a"></span><span class="mi-b"></span></a></li>
        <li><a href="#" data-i18n-pair="nav.contact"><span class="mi-a"></span><span class="mi-b"></span></a></li>
      </ul>
      <div class="menu-lang">
        <button type="button" class="lang-btn is-active" data-lang="tr">TR</button>
        <span class="sep">/</span>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
      </div>
    </nav>

    <button class="corner corner--left" type="button">
      <span data-i18n="ui.filter">Projeleri filtrele</span> <i>+</i>
    </button>
    <button class="corner corner--right" type="button" id="viewToggle" aria-pressed="false">
      <span id="viewToggleLabel">Izgara görünümü</span> <i>+</i>
    </button>

    <!-- Mobile category strip, filled from projects.json. Scrolls sideways. -->
    <div class="cat-row" id="catRow" role="tablist" aria-label="Proje kategorileri"></div>

    <!-- Appears only once a category is open. Labelled rather than an icon, so
         the way back reads without being learned. -->
    <button class="ring-back" type="button" id="ringBack" hidden>
      <i class="arrow">←</i><span id="ringBackLabel">Tüm kategoriler</span>
      <em id="ringBackWhere"></em>
    </button>

    <div class="scene">
      <!-- The hairline sits inside the gallery so it shares the cards' 3D
           space and weaves in front of some and behind others. -->
      <div class="gallery" id="gallery">
        <div class="ring-line" id="ringLine" aria-hidden="true"></div>
      </div>
      <div class="center" id="center">
        <div class="center-default" id="centerDefault">
          <p class="center-eyebrow" data-i18n="ui.selectedWorks">Seçili İşler</p>
          <h1 class="center-title">Corniche <em>İstanbul.</em></h1>
          <p class="center-sub" data-i18n="ui.tagline">[Firma tanıtım cümlesi]</p>
        </div>
        <div class="center-project" id="centerProject">
          <div class="preview-img" id="previewImg"><img alt="" /></div>
          <p class="preview-cat" id="previewCat"></p>
          <h2 class="preview-title" id="previewTitle"></h2>
        </div>
      </div>
      <div class="labels" id="labels"></div>
    </div>

    <div class="mobile-preview" id="mobilePreview">
      <p class="mp-cat" id="mpCat"></p>
      <h1 class="mp-title" id="mpTitle"></h1>
      <div class="mp-img" id="mpImg"><img alt="" /></div>
      <a class="mp-view" id="mpView" href="#"><span data-i18n="ui.viewProject">Projeyi incele</span> <i>+</i></a>
    </div>

    <!-- Flat alternative to the ring: every project, grouped by category, in
         ordinary document flow. Also what a visitor who has asked for reduced
         motion gets on arrival. -->
    <main class="grid-view" id="gridView" hidden>
      <div class="grid-inner" id="gridInner"></div>
    </main>

    <div class="mobile-ring-hitbox" id="ringHitbox"></div>
    <div class="custom-cursor" id="cursor"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
