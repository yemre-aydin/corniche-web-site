<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Work in progress, shared privately for review. These keep the draft out
         of search results while it carries a real company's name; remove them
         when the site goes live. A robots.txt would not help here: crawlers only
         read it at the domain root, which this project site does not own. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="googlebot" content="noindex, nofollow" />
    <title>Corniche İstanbul — Projeler</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="loading-screen" id="loadingScreen" role="status">
      <div class="loading-inner">
        <div class="loading-brand">CORNICHE İSTANBUL</div>
        <div class="loading-text" data-i18n="ui.loading">Arşiv yükleniyor</div>
        <div class="loading-bar"><span></span></div>
      </div>
    </div>

    <header class="site-header">
      <div class="header-left">
        <!-- Placeholder wordmark. The dashed rule marks where the real logo goes. -->
        <div class="brand" id="brand">CORNICHE İSTANBUL</div>
        <nav class="nav">
          <a href="#" class="is-active" data-i18n="nav.projects">Projeler</a>
          <a href="#" data-i18n="nav.about">Hakkımızda</a>
          <a href="#" data-i18n="nav.services">Hizmetlerimiz</a>
          <a href="#" data-i18n="nav.showroom">Showroom</a>
          <a href="#" data-i18n="nav.contact">İletişim</a>
        </nav>
      </div>
      <div class="lang" id="lang">
        <button type="button" class="lang-btn is-active" data-lang="tr">TR</button>
        <span class="sep">/</span>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
      </div>
      <button class="menu-toggle" type="button" aria-label="Menü"><span></span><span></span></button>
    </header>

    <button class="corner corner--left" type="button">
      <span data-i18n="ui.filter">Projeleri filtrele</span> <i>+</i>
    </button>
    <button class="corner corner--right" type="button">
      <span data-i18n="ui.grid">Izgara görünümü</span> <i>+</i>
    </button>

    <!-- Mobile category strip, filled from projects.json. Scrolls sideways. -->
    <div class="cat-row" id="catRow" role="tablist" aria-label="Proje kategorileri"></div>

    <div class="scene">
      <div class="gallery" id="gallery"></div>
      <div class="center" id="center">
        <div class="center-default" id="centerDefault">
          <p class="center-eyebrow" data-i18n="ui.selectedWorks">Seçili İşler</p>
          <h1 class="center-title">Corniche <em>İstanbul.</em></h1>
          <p class="center-sub" data-i18n="ui.tagline">[Firma tanıtım cümlesi]</p>
        </div>
        <div class="center-project" id="centerProject">
          <div class="preview-img" id="previewImg"><img alt="" /></div>
          <p class="preview-cat" id="previewCat"></p>
          <h2 class="preview-title" id="previewTitle"></h2>
        </div>
      </div>
      <div class="labels" id="labels"></div>
    </div>

    <div class="mobile-preview" id="mobilePreview">
      <p class="mp-cat" id="mpCat"></p>
      <h1 class="mp-title" id="mpTitle"></h1>
      <div class="mp-img" id="mpImg"><img alt="" /></div>
      <a class="mp-view" href="#"><span data-i18n="ui.viewProject">Projeyi incele</span> <i>+</i></a>
    </div>

    <div class="mobile-ring-hitbox" id="ringHitbox"></div>
    <div class="custom-cursor" id="cursor"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
