name: Ring thumbnails

# Whenever a photo is added to, or replaced in, studio-3d-archive/public/, this
# generates the small copy the ring uses and commits it back. Nobody has to run
# anything by hand: upload the photo, the small copy appears a moment later.

on:
  push:
    branches: [main]
    paths:
      - 'studio-3d-archive/public/*.webp'
      - 'studio-3d-archive/public/*.jpg'
      - 'studio-3d-archive/public/*.jpeg'
      - 'studio-3d-archive/public/*.png'
      - 'studio-3d-archive/projects.json'
      - 'tools/make-thumbs.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: thumbnails
  cancel-in-progress: false

jobs:
  thumbnails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # sharp carries its own image support, so this needs nothing installed on
      # the runner. ImageMagick is no longer preinstalled on ubuntu-latest.
      - name: Install sharp
        run: npm install --no-save sharp@0.33.5

      - name: Generate the small ring copies
        run: node tools/make-thumbs.mjs

      - name: Check the content list
        run: |
          cd studio-3d-archive
          node -e '
            const fs = require("fs");
            const listed = JSON.parse(fs.readFileSync("projects.json", "utf8")).projects || [];
            const onDisk = fs.readdirSync("public").filter((f) => /\.(webp|jpe?g|png)$/i.test(f));
            const names = new Set(listed.map((p) => p.image));
            const missing = listed.filter((p) => !onDisk.includes(p.image));
            const unused = onDisk.filter((f) => !names.has(f));
            if (missing.length) console.log("::warning::Listed in projects.json but not in public/: " + missing.map((p) => `${p.image} (${p.title})`).join(", "));
            if (unused.length) console.log("::warning::In public/ but not listed in projects.json, so not shown: " + unused.join(", "));
            console.log(`${listed.length} projects listed, ${onDisk.length} photos on disk.`);
          '

      - name: Commit the small copies
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio-3d-archive/public/thumb
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Regenerate ring thumbnails"
            git push
          fi
